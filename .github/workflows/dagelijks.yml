name: Dagelijkse outreach

on:
  schedule:
    - cron: "17 8 * * 1-5"   # maandag t/m vrijdag rond 09:17 (Spaanse tijd, wintertijd)
  workflow_dispatch:
    inputs:
      stand:
        description: "Leeg = stand uit instellingen.json, of 'proef' / 'echt'"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: outreach
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      - name: Outreach draaien
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SENDER_NAME: ${{ secrets.SENDER_NAME }}
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          STAND_OVERRIDE: ${{ github.event.inputs.stand }}
        run: python -u dagelijks.py
      - name: Logboek bewaren (voor de app)
        if: always()
        run: |
          git config user.name "Nocturo"
          git config user.email "actions@users.noreply.github.com"
          git add logboek || true
          git diff --cached --quiet && exit 0
          git commit -m "Logboek $(date +%F)"
          for i in 1 2 3; do git pull --rebase -q && git push -q && exit 0; sleep 5; done
          exit 1
