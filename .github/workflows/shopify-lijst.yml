name: Shopify-lijst bijwerken

on:
  schedule:
    - cron: "43 3 * * 0"   # elke zondagnacht
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: shopify-lijst
  cancel-in-progress: false

jobs:
  bijwerken:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      - run: python -u shopify_lijst_bijwerken.py
      - name: Opslaan
        run: |
          git config user.name "outreach-bot"
          git config user.email "outreach-bot@users.noreply.github.com"
          git add shopify_winkels.txt
          git diff --cached --quiet || (git commit -m "Shopify-lijst bijgewerkt" && git push)
